[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "online-fdr"
version = "1.0.0"
description = "Online False Discovery Rate (FDR) control algorithms for multiple hypothesis testing"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
keywords = [
    "statistics",
    "hypothesis-testing",
    "fdr",
    "false-discovery-rate",
    "online-algorithms",
    "multiple-testing",
    "sequential-testing",
    "batched-testing",
]
authors = [
    { name = "Oliver Hennhöfer", email = "oliver.hennhoefer@mail.de" },
]
maintainers = [
    { name = "Oliver Hennhöfer", email = "oliver.hennhoefer@mail.de" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.9.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.20",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocs-minify-plugin>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "build>=1.2",
]
parity = [
    "rpy2>=3.5",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.20",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocs-minify-plugin>=0.6",
]

[project.urls]
Homepage = "https://github.com/OliverHennhoefer/online-fdr"
Documentation = "https://oliverhennhoefer.github.io/online-fdr"
Repository = "https://github.com/OliverHennhoefer/online-fdr.git"
Issues = "https://github.com/OliverHennhoefer/online-fdr/issues"
Changelog = "https://github.com/OliverHennhoefer/online-fdr/blob/main/CHANGELOG.md"
Security = "https://github.com/OliverHennhoefer/online-fdr/blob/main/SECURITY.md"

[tool.hatch.version]
path = "online_fdr/__init__.py"

[tool.hatch.build]
include = [
    "online_fdr/**/*.py",
    "online_fdr/py.typed",
    "README.md",
    "LICENSE",
]
exclude = [
    "*.pyc",
    "__pycache__",
    ".git",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.hatch.build.targets.wheel]
packages = ["online_fdr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["online_fdr"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]


[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "B905",  # do not require zip(strict=...) across legacy code paths/tests
    "C901",  # too complex
    "E501",  # line length handled by formatter/doc rendering
    "E741",  # allow legacy parameter names in public APIs
    "N806",  # allow canonical statistical matrix names like Sigma
    "SIM102", # allow clearer nested conditionals in lightweight test helpers
    "SIM108", # avoid forcing ternary rewrites for readability
    "UP006",  # avoid bulk annotation rewrites in stable code
    "UP035",  # keep typing imports for compatibility/readability
    "UP045",  # avoid bulk Optional -> X|None rewrites
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # imported but unused
"tests/*" = ["S101", "B007"]  # use of assert and enumerate loop vars in tests

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
