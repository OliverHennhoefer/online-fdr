name: R Container Parity

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    container:
      image: rocker/r-ver:4.5.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            git \
            libbz2-dev \
            libdeflate-dev \
            libffi-dev \
            libicu-dev \
            liblzma-dev \
            libpcre2-dev \
            libtirpc-dev \
            libzstd-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            zlib1g-dev

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "/root/.local/bin" >> "$GITHUB_PATH"

      - name: Verify runtimes
        run: |
          python3 --version
          R --version
          uv --version

      - name: Install onlineFDR (pinned)
        timeout-minutes: 30
        uses: ./.github/actions/install-onlinefdr

      - name: Install dependencies
        run: uv sync --locked --group dev --group parity --python python3

      - name: Run live parity tests
        run: uv run python -m pytest -m live_r_parity tests/test_onlinefdr_parity.py tests/test_async_methods.py -q
