name: Tests (Container)

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "online_fdr/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests-container.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: rocker/r-ver:4.5.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            git \
            libffi-dev \
            libtirpc-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "/root/.local/bin" >> "$GITHUB_PATH"

      - name: Verify runtimes
        run: |
          python3 --version
          R --version
          uv --version

      - name: Install onlineFDR (pinned)
        run: |
          Rscript -e "if (!requireNamespace('BiocManager', quietly=TRUE)) install.packages('BiocManager', repos='https://cloud.r-project.org')"
          Rscript -e "BiocManager::install('onlineFDR', version='3.22', ask=FALSE, update=FALSE)"
          Rscript -e "stopifnot(as.character(utils::packageVersion('onlineFDR')) == '2.18.0')"

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Run full test suite
        run: uv run python -m pytest -q
