name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "online_fdr/**"
      - "tests/**"
      - "docs/**"
      - "examples/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run python -m ruff check .

      - name: Format check
        if: matrix.python-version == '3.12'
        run: uv run python -m ruff format --check online_fdr tests

      - name: Type check
        if: matrix.python-version == '3.12'
        run: uv run python -m mypy online_fdr tests/typing

      - name: Test without live R parity
        run: uv run python -m pytest -q

  parity:
    name: Live R parity
    uses: ./.github/workflows/live-r-parity.yml

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The revision-date plugin needs the complete Git history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --locked --group docs --no-dev --python 3.12

      - name: Build docs
        run: uv run mkdocs build --strict

  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install build dependencies
        run: uv sync --locked --group dev --python 3.12

      - name: Build sdist and wheel
        run: uv run python -m build

      - name: Wheel smoke import
        run: |
          uv venv .smoke --python 3.12
          uv pip install --python .smoke/bin/python dist/*.whl
          .smoke/bin/python -c "import online_fdr; print(online_fdr.__version__)"
