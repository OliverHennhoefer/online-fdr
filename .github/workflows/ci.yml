name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "online_fdr/**"
      - "tests/**"
      - "docs/**"
      - "examples/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run python -m ruff check .

      - name: Format check
        if: matrix.python-version == '3.12'
        run: uv run python -m ruff format --check online_fdr tests

      - name: Type check
        if: matrix.python-version == '3.12'
        run: uv run python -m mypy online_fdr

      - name: Test without live R parity
        run: uv run python -m pytest -q

  parity:
    name: Live R parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system libraries for rpy2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libbz2-dev \
            libdeflate-dev \
            libicu-dev \
            liblzma-dev \
            libpcre2-dev \
            libzstd-dev \
            zlib1g-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install onlineFDR (pinned)
        timeout-minutes: 30
        run: |
          Rscript -e "options(timeout=600, repos=c(CRAN='https://cloud.r-project.org')); if (!requireNamespace('BiocManager', quietly=TRUE)) install.packages('BiocManager')"
          Rscript -e "options(timeout=600, repos=BiocManager::repositories(version='3.22')); BiocManager::install(version='3.22', ask=FALSE, update=FALSE)"
          Rscript -e "options(timeout=600, repos=BiocManager::repositories(version='3.22')); BiocManager::install('onlineFDR', version='3.22', ask=FALSE, update=FALSE, Ncpus=2)"
          Rscript -e "stopifnot(as.character(utils::packageVersion('onlineFDR')) == '2.18.0')"

      - name: Install dependencies
        run: uv sync --locked --group dev --group parity --python 3.12

      - name: Run live parity tests
        run: uv run python -m pytest -m live_r_parity tests/test_onlinefdr_parity.py tests/test_async_methods.py -q

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --locked --group docs --no-dev --python 3.12

      - name: Build docs
        run: uv run mkdocs build --strict

  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install build dependencies
        run: uv sync --locked --group dev --python 3.12

      - name: Build sdist and wheel
        run: uv run python -m build

      - name: Wheel smoke import
        run: |
          uv venv .smoke --python 3.12
          uv pip install --python .smoke/bin/python dist/*.whl
          .smoke/bin/python -c "import online_fdr; print(online_fdr.__version__)"
