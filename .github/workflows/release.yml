name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The revision-date plugin needs the complete Git history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev --group docs --python 3.12

      - name: Validate release version
        run: |
          uv run python - <<'PY'
          import os
          from importlib.metadata import version

          import online_fdr

          package_version = version("online-fdr")
          if online_fdr.__version__ != package_version:
              raise SystemExit(
                  f"Package version {online_fdr.__version__!r} does not match "
                  f"distribution version {package_version!r}."
              )
          if os.environ["GITHUB_REF_TYPE"] != "tag":
              raise SystemExit(0)
          expected_tag = f"v{package_version}"
          actual_tag = os.environ["GITHUB_REF_NAME"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {actual_tag!r} does not match package version; "
                  f"expected {expected_tag!r}."
              )
          PY

      - name: Lint
        run: uv run python -m ruff check .

      - name: Format check
        run: uv run python -m ruff format --check online_fdr tests

      - name: Type check
        run: uv run python -m mypy online_fdr tests/typing

      - name: Test without live R parity
        run: uv run python -m pytest -q

      - name: Build docs
        run: uv run mkdocs build --strict

      - name: Build sdist and wheel
        run: uv run python -m build

      - name: Smoke install wheel
        run: |
          uv venv .smoke --python 3.12
          uv pip install --python .smoke/bin/python dist/*.whl
          .smoke/bin/python -c "import online_fdr; print(online_fdr.__version__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  parity:
    name: Live R parity
    uses: ./.github/workflows/live-r-parity.yml

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, parity]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
