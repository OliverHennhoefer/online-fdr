name: Live R parity

on:
  workflow_call:

permissions:
  contents: read

jobs:
  parity:
    name: Live R parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system libraries for rpy2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libbz2-dev \
            libdeflate-dev \
            libicu-dev \
            liblzma-dev \
            libpcre2-dev \
            libzstd-dev \
            zlib1g-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install onlineFDR (pinned)
        timeout-minutes: 30
        uses: ./.github/actions/install-onlinefdr

      - name: Install dependencies
        run: uv sync --locked --group dev --group parity --python 3.12

      - name: Run live parity tests
        run: uv run python -m pytest -m live_r_parity tests/test_onlinefdr_parity.py tests/test_async_methods.py -q
